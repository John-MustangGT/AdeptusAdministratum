<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AdRostra{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav>
      <a class="brand" href="/">⚙ AdRostra</a>
      <ul>
        <li><a href="/datasheets">Datasheets</a></li>
        <li><a href="/roster">My Roster</a></li>
      </ul>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>Self-hosted army list builder &mdash; <a href="/roster/export.json">Export Roster JSON</a></p>
  </footer>

  <script>
    // Preserve open/closed state of id'd <details> elements across every HTMX swap.
    // Works for both the role-group browser panels and the per-unit wargear panel.
    (function () {
      var saved = {};
      document.body.addEventListener('htmx:beforeSwap', function () {
        saved = {};
        document.querySelectorAll('details[id]').forEach(function (d) {
          saved[d.id] = d.open;
        });
      });
      document.body.addEventListener('htmx:afterSettle', function () {
        document.querySelectorAll('details[id]').forEach(function (d) {
          if (saved[d.id]) d.setAttribute('open', '');
        });
      });
    })();

    // Inject current DOM configure state into every roster mutation request
    // (Add / Remove / Move).  This prevents stale session data from resetting
    // wargear selections when a mutation fires before configure has saved.
    document.body.addEventListener('htmx:configRequest', function (evt) {
      if (!evt.detail.elt.classList.contains('roster-mutation-form')) return;
      var states = [];
      document.querySelectorAll('form.unit-configure-form').forEach(function (form) {
        var entryId = form.dataset.entryId;
        if (!entryId) return;
        var fd = new FormData(form);
        var mc = parseInt(fd.get('model_count') || '1', 10);
        if (isNaN(mc) || mc < 1) mc = 1;
        states.push({
          entry_id:      entryId,
          model_count:   mc,
          chosen_options: fd.getAll('options'),
          custom_name:   fd.get('custom_name') || ''
        });
      });
      if (states.length > 0) {
        evt.detail.parameters['current_configure'] = JSON.stringify(states);
      }
    });
  </script>
</body>
</html>
