[package]
name = "adeptus-administratum"
version = "0.1.0"
edition = "2021"
description = "Self-hosted tabletop wargaming army list builder"
license = "MIT"

[[bin]]
name = "adeptus-administratum"
path = "src/main.rs"

[lib]
name = "adeptus_administratum"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
# None yet; unit tests live in-module
